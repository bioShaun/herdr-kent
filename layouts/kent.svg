  <path d="M138 120.5 h9 l-4.5 5 z" fill="#565a63"/>
  <rect x="36" y="135" width="7" height="7" rx="2" fill="#565a63"/>
  <rect x="48" y="136" width="42" height="5" rx="2.5" fill="#6b7280"/>

  <!-- default group hint -->
  <rect x="22" y="152" width="14" height="9" rx="1.5" fill="#565a63"/>
