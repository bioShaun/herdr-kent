  <rect x="28" y="60" width="3.5" height="11" rx="1.75" fill="#a78bfa"/>
  <rect x="36" y="62" width="7" height="7" rx="2" fill="#8b8f98"/>
  <rect x="48" y="63" width="54" height="5" rx="2.5" fill="#a78bfa"/>
  <rect x="36" y="77" width="7" height="7" rx="2" fill="#565a63"/>
  <rect x="48" y="78" width="38" height="5" rx="2.5" fill="#6b7280"/>

  <!-- group: code (folded) — status dot stays visible -->
  <rect x="22" y="94" width="6" height="4" rx="1" fill="#a78bfa"/>
  <rect x="22" y="96.5" width="14" height="9" rx="1.5" fill="#a78bfa"/>
