  <rect x="10" y="14" width="300" height="172" rx="6" fill="#232529" stroke="#3a3d45" stroke-width="1.5"/>
  <rect x="158" y="14" width="1.5" height="172" fill="#3a3d45"/>

  <!-- group: design (open) -->
  <rect x="22" y="28" width="6" height="4" rx="1" fill="#a78bfa"/>
  <rect x="22" y="30.5" width="14" height="9" rx="1.5" fill="#a78bfa"/>
  <rect x="42" y="31.5" width="36" height="6" rx="3" fill="#9ca3af"/>
  <rect x="84" y="31.5" width="9" height="6" rx="2" fill="#3a3d45"/>
  <path d="M138 32.5 h9 l-4.5 5 z" fill="#565a63"/>
