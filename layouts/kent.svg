<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Kent thumbnail: the grouped Spaces sidebar is the hero.
       Folder group headers (violet) + indented members, one folded group
       keeping its red status dot; the work area stays quiet. No text. -->
