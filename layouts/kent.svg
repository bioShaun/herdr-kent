  <circle cx="124" cy="100.5" r="3.5" fill="#f87171"/>
  <path d="M139 96 v9 l5 -4.5 z" fill="#565a63"/>

  <!-- group: experiments (open, one member) -->
  <rect x="22" y="116" width="6" height="4" rx="1" fill="#a78bfa"/>
